<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid World DRL - 完整整合版</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        .controls { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd; }
        .controls button { padding: 8px 15px; margin-right: 10px; cursor: pointer; border: 1px solid #aaa; background: white; border-radius: 4px; font-weight: bold;}
        .controls button:hover { background: #e9ecef; }
        
        .btn-hw2 { background: #e0f7fa !important; border-color: #00bcd4 !important; }
        .btn-hw3 { background: #fff9c4 !important; border-color: #ffeb3b !important; }
        
        .grid-container { display: flex; gap: 40px; margin-top: 30px; flex-wrap: wrap; }
        .grid-box { display: flex; flex-direction: column; }
        
        table { border-collapse: collapse; margin-top: 10px; background: white; }
        td {
            border: 1px solid black; width: 50px; height: 50px;
            text-align: center; vertical-align: middle;
            font-size: 16px; font-weight: bold; cursor: pointer; user-select: none;
        }
        
        /* 定義 HW1-1 的狀態顏色 */
        .start { background-color: #008000; color: white; }
        .end { background-color: #ff0000; color: white; }
        .obstacle { background-color: #808080; color: white; }
        .path { background-color: #FFFF99; color: black; }
        .value-cell { font-size: 14px; font-weight: normal; }
    </style>
</head>
<body>
    <h2>Grid World: Reinforcement Learning (HW1 完整版)</h2>
    
    <div class="controls">
        <label>Grid Size (n x n): </label>
        <input type="number" id="gridSize" min="3" max="10" value="5" style="width: 50px; margin-right: 15px;">
        
        <button onclick="generateGrid()">1. 建立網格 (HW1-1)</button>
        <button class="btn-hw2" onclick="runAlgorithm('/api/evaluate_random')">2. 執行策略評估 (HW1-2)</button>
        <button class="btn-hw3" onclick="runAlgorithm('/api/value_iteration')">3. 執行價值迭代 (HW1-3)</button>
    </div>

    <p style="color: blue;">📌 操作說明：點擊下方網格設定 <b>起點(綠)</b> ➔ <b>終點(紅)</b> ➔ <b>障礙物(灰)</b></p>
    
    <table id="mainGrid"></table>

    <div class="grid-container" id="resultsArea" style="display: none;">
        <div class="grid-box">
            <h3 id="policyTitle">Policy & Path Matrix</h3>
            <table id="policyGrid"></table>
        </div>
        <div class="grid-box">
            <h3>Value Matrix</h3>
            <table id="valueGrid"></table>
        </div>
    </div>

    <script>
        let n = 5;
        let startCoord = null;
        let endCoord = null;
        let obstaclesCoords = [];
        const arrowMap = { 'U': '↑', 'D': '↓', 'L': '←', 'R': '→', 'end': 'E', 'obs': '' };

        // 1. 初始化網格 (HW1-1)
        function generateGrid() {
            n = parseInt(document.getElementById('gridSize').value);
            startCoord = null; endCoord = null; obstaclesCoords = [];
            document.getElementById('resultsArea').style.display = 'none';
            
            const mainGrid = document.getElementById('mainGrid');
            mainGrid.innerHTML = '';
            
            for (let r = 0; r < n; r++) {
                let tr = document.createElement('tr');
                for (let c = 0; c < n; c++) {
                    let td = document.createElement('td');
                    td.innerText = r * n + c + 1;
                    td.onclick = () => handleCellClick(td, r, c);
                    tr.appendChild(td);
                }
                mainGrid.appendChild(tr);
            }
        }

        // 處理網格點擊變色
        function handleCellClick(td, r, c) {
            if (td.classList.length > 0) return; 
            
            if (!startCoord) {
                td.classList.add('start');
                td.innerText = 'S';
                startCoord = [r, c];
            } else if (!endCoord) {
                td.classList.add('end');
                td.innerText = 'E';
                endCoord = [r, c];
            } else {
                td.classList.add('obstacle');
                td.innerText = 'X';
                obstaclesCoords.push([r, c]);
            }
        }

        // 2 & 3. 呼叫後端 API 執行 RL 演算法 (HW1-2 & HW1-3)
        function runAlgorithm(endpoint) {
            if (!endCoord) {
                alert("請至少在網格上點出終點 (紅色)！");
                return;
            }
            if (endpoint.includes("value_iteration") && !startCoord) {
                alert("價值迭代需要設定起點 (綠色) 才能畫出最佳路徑！");
                return;
            }

            const payload = { n: n, start: startCoord, end: endCoord, obstacles: obstaclesCoords };

            // 使用 JS fetch 將資料丟給 Flask 後端算數學
            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.error) {
                    alert(data.error);
                    return;
                }
                
                // 動態切換標題
                document.getElementById('policyTitle').innerText = endpoint.includes("evaluate_random") ? "隨機策略 (Random Policy)" : "最佳政策與路徑 (Optimal Policy)";
                
                drawResults(data.v_matrix, data.policy, data.path);
            })
            .catch(err => console.error("Error:", err));
        }

        // 將 Python 算好的結果繪製成完美表格
        function drawResults(V, policy, path) {
            document.getElementById('resultsArea').style.display = 'flex';
            const policyGrid = document.getElementById('policyGrid');
            const valueGrid = document.getElementById('valueGrid');
            policyGrid.innerHTML = ''; valueGrid.innerHTML = '';

            const pathSet = new Set(path.map(p => `${p[0]},${p[1]}`));

            for (let r = 0; r < n; r++) {
                let pRow = document.createElement('tr');
                let vRow = document.createElement('tr');
                
                for (let c = 0; c < n; c++) {
                    let isStart = startCoord && r === startCoord[0] && c === startCoord[1];
                    let isEnd = endCoord && r === endCoord[0] && c === endCoord[1];
                    let isObs = obstaclesCoords.some(o => o[0] === r && o[1] === c);
                    let isPath = pathSet.has(`${r},${c}`);

                    // --- Policy 儲存格 ---
                    let pCell = document.createElement('td');
                    pCell.innerHTML = arrowMap[policy[r][c]] || '';
                    if (isStart) { pCell.classList.add('start'); pCell.innerHTML = 'S<br>' + pCell.innerHTML; }
                    else if (isEnd) { pCell.classList.add('end'); }
                    else if (isObs) { pCell.classList.add('obstacle'); }
                    else if (isPath) { pCell.classList.add('path'); }
                    pRow.appendChild(pCell);

                    // --- Value 儲存格 ---
                    let vCell = document.createElement('td');
                    vCell.className = 'value-cell';
                    if (isStart) { vCell.classList.add('start'); vCell.innerText = V[r][c].toFixed(2); }
                    else if (isEnd) { vCell.classList.add('end'); vCell.innerText = '0.00'; }
                    else if (isObs) { vCell.classList.add('obstacle'); }
                    else { 
                        if (isPath) vCell.style.backgroundColor = '#e0f7fa'; // 路徑底色淺藍
                        vCell.innerText = V[r][c].toFixed(2); 
                    }
                    vRow.appendChild(vCell);
                }
                policyGrid.appendChild(pRow);
                valueGrid.appendChild(vRow);
            }
        }
        
        // 畫面一載入就先產生 5x5 的網格
        window.onload = generateGrid;
    </script>
</body>
</html>
